<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أ. أحمد سمير | مدرس دراسات اجتماعية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-soft:#f0d98a;--ink:#0d0f14;--text:#f4efe2;--muted:#b9b3a3;--glass:rgba(255,255,255,.07);--line:rgba(212,175,55,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(212,175,55,.22),transparent 45%),radial-gradient(circle at 90% 90%,rgba(212,175,55,.14),transparent 50%),var(--ink);display:flex;justify-content:center;padding:28px 16px;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:420px;background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:28px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.top{display:flex;justify-content:flex-start;margin-bottom:6px}
.icon-btn{background:var(--glass);border:1px solid var(--line);color:var(--gold-soft);width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--ink);background:linear-gradient(145deg,var(--gold-soft),var(--gold));box-shadow:0 0 0 5px rgba(212,175,55,.18)}
h1{font-size:26px;font-weight:800;color:var(--gold-soft)}
.job{margin-top:4px;font-size:16px;font-weight:500}
.tag{margin:12px auto 22px;max-width:30ch;color:var(--muted);font-size:14px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:18px;color:var(--gold-soft)}
.btns{display:grid;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:16px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:1px solid var(--line);color:var(--text);background:var(--glass)}
.btn.main{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--ink);border:none}
.btn.wa{background:#1f9d55;border:none;color:#fff}
.btn:active,.icon-btn:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:20px;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <button class="icon-btn" id="share" aria-label="مشاركة الكارت"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  </div>
  <div class="avatar" aria-hidden="true">أ</div>
  <h1>أ. أحمد سمير</h1>
  <p class="job">مدرس دراسات اجتماعية</p>
  <p class="tag">شرح مبسط لمنهج الدراسات للمرحلة الإعدادية، مع متابعة مستمرة لولي الأمر.</p>

  <div class="stats">
    <div class="stat"><b>+10</b>سنوات خبرة</div>
    <div class="stat"><b>+300</b>طالب</div>
    <div class="stat"><b>إعدادي</b>المرحلة</div>
  </div>

  <div class="btns">
    <button class="btn main" id="save"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>حفظ جهة الاتصال</button>
    <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-4.2-7.6L21 3l-1.2 4.2A9 9 0 0 1 21 12z"/></svg>تواصل واتساب</a>
    <a class="btn" id="map" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>موقع السنتر</a>
  </div>
  <p class="foot">كارت تجريبي، البيانات للعرض فقط.</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// عدّل البيانات دي لكل عميل
const P={name:"أحمد سمير",job:"مدرس دراسات اجتماعية",phone:"01000000000",intl:"201000000000",map:"https://www.google.com/maps/search/?api=1&query=Cairo"};
const $=id=>document.getElementById(id);
$('wa').href="https://wa.me/"+P.intl+"?text="+encodeURIComponent("السلام عليكم أ. "+P.name+"، حابب أستفسر عن حصص الدراسات.");
$('map').href=P.map;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
$('save').onclick=()=>{
  const v="BEGIN:VCARD\nVERSION:3.0\nFN:"+P.name+"\nTITLE:"+P.job+"\nTEL;TYPE=CELL:+"+P.intl+"\nEND:VCARD";
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));
  a.download=P.name+".vcf";a.click();
  toast("تم حفظ جهة الاتصال");
};
$('share').onclick=async()=>{
  try{
    if(navigator.share){await navigator.share({title:P.name,text:P.job,url:location.href})}
    else{await navigator.clipboard.writeText(location.href);toast("تم نسخ الرابط")}
  }catch(e){}
};
</script>
</body>
</html>
