<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<title>محمد عبدالله - مترجم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:#0a0a0e}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:#f5f1e6;min-height:100vh;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
a,button{font-family:inherit;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s}
a:active,button:active{transform:scale(.97)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{position:relative;overflow:hidden;width:100%;max-width:430px;min-height:100vh;padding:20px 20px 40px;display:flex;flex-direction:column;gap:20px}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g1{top:-110px;right:-90px;width:320px;height:320px;background:radial-gradient(circle,rgba(212,175,55,.28),transparent 70%)}
.g2{bottom:-130px;left:-110px;width:380px;height:380px;background:radial-gradient(circle,rgba(212,175,55,.16),transparent 70%)}
header{position:relative;display:flex;align-items:center;justify-content:space-between}
.tag{font-size:14px;font-weight:700;color:#d4af37}
.share{height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:22px;border:1px solid rgba(212,175,55,.45);background:rgba(255,255,255,.06);color:#f3d98b;font-size:14px;font-weight:700}
.card{position:relative;padding:32px 20px 24px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#f3d98b,#a67c1a)}
.ring img{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;background:#14130f}
h1{margin-top:6px;font-size:30px;font-weight:800;color:#fff}
.chip{padding:6px 20px;border-radius:20px;border:1px solid rgba(212,175,55,.5);background:rgba(212,175,55,.1);color:#f3d98b;font-size:15px;font-weight:700}
.tagline{font-size:16px;line-height:1.7;color:#cdc8b8}
.hr{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.6),transparent)}
.phone{min-height:44px;display:flex;align-items:center;gap:10px;direction:ltr;font-size:20px;letter-spacing:1px}
.phone svg{color:#d4af37}
.save{width:100%;height:60px;border:0;border-radius:18px;background:linear-gradient(135deg,#f3d98b,#d4af37 50%,#a67c1a);color:#1a1405;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 28px rgba(212,175,55,.35)}
.save svg{stroke-width:2}
.row{width:100%;display:flex;gap:12px}
.btn{flex:1;height:56px;border-radius:16px;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.wa{border:1px solid rgba(74,222,128,.45);background:rgba(74,222,128,.12)}
.wa svg{color:#4ade80}
.map{border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.1)}
.map svg{color:#f3d98b}
.social{display:flex;gap:14px;margin-top:6px}
.social a{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#f3d98b;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:24px;background:rgba(20,19,15,.95);border:1px solid rgba(212,175,55,.5);color:#f3d98b;font-size:14px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head>

  <div class="glow g2"></div>

  <header>
    <span class="tag">بطاقة رقمية</span>
    <button id="share" class="share">
      <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span>مشاركة الكارت</span>
    </button>
  </header>

        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
    </div>
  </section>

  <div id="toast"></div>
</main>

<script>
const C = {
  first: 'محمد', last: 'عبدالله', title: 'مترجم',
  tagline: 'ترجمة وتحويل ملفات ومنتجات رقمية',
  phone: '+201021480092',
  email: '' // ضع بريدك هنا ليُحفظ مع جهة الاتصال
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.id);
  toast.id = setTimeout(() => t.classList.remove('show'), 2600);
}

document.getElementById('wa').href = 'https://wa.me/' + C.phone.replace('+', '') +
  '?text=' + encodeURIComponent('مرحباً محمد، أريد الاستفسار عن خدمات الترجمة');

document.getElementById('save').addEventListener('click', () => {
  try {
    const lines = ['BEGIN:VCARD', 'VERSION:3.0',
      'N:' + C.last + ';' + C.first + ';;;', 'FN:' + C.first + ' ' + C.last,
      'TITLE:' + C.title, 'NOTE:' + C.tagline, 'TEL;TYPE=CELL:' + C.phone];
    if (C.email) lines.push('EMAIL;TYPE=INTERNET:' + C.email);
    lines.push('END:VCARD');
    const blob = new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Mohamed-Abdullah.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('تم تجهيز ملف جهة الاتصال');
  } catch (e) {
    toast('تعذّر حفظ جهة الاتصال');
  }
});

document.getElementById('share').addEventListener('click', async () => {
  const web = /^https?:$/.test(location.protocol);
  const data = { title: C.first + ' ' + C.last + ' - ' + C.title, text: web ? C.tagline : (C.first + ' ' + C.last + ' - ' + C.phone) };
  if (web) data.url = location.href;
  try {
    if (navigator.share) {
      await navigator.share(data);
    } else if (web && navigator.clipboard) {
      await navigator.clipboard.writeText(location.href);
      toast('تم نسخ رابط الكارت');
    } else {
      toast(web ? 'المشاركة غير مدعومة على هذا الجهاز' : 'المشاركة تعمل بعد رفع الكارت على رابط');
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    if (web && navigator.clipboard) {
      try { await navigator.clipboard.writeText(location.href); toast('تم نسخ رابط الكارت'); return; } catch (x) {}
    }
    toast('تعذّرت المشاركة، انسخ الرابط من المتصفح');
  }
});

</script>
</body>
</html>
